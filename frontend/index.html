<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Needle — a source-grounded knowledge assistant workspace." />
  <title>Needle — Knowledge Workspace</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" aria-label="Primary navigation">
      <button class="mark" id="homeMark" aria-label="Ask home" data-page="ask">N</button>
      <div class="rail-nav">
        <button class="icon-btn active" aria-label="Ask" data-tip="Ask" data-page="ask">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg>
        </button>
        <button class="icon-btn" aria-label="Knowledge base" data-tip="Knowledge base" data-page="knowledge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Index pipeline" data-tip="Index pipeline" data-page="pipeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h6v10H4zM14 4h6v6h-6zM14 14h6v6h-6z"/><path d="M10 12h4"/></svg>
        </button>
        <button class="icon-btn" aria-label="Analytics" data-tip="Analytics" data-page="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V5M4 19h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="icon-btn" aria-label="Settings" data-tip="Settings" data-page="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </nav>

    <header class="topbar">
      <div class="crumbs"><span id="workspaceName">Needle</span><span class="slash">/</span><strong id="currentCrumb">Ask</strong></div>
      <div class="top-actions">
        <button class="threads-toggle" id="threadsToggle" type="button">Threads</button>
        <button class="mobile-source-toggle" id="sourceToggle" type="button">Sources</button>
        <div class="sync-pill" id="syncPill"><i class="live-dot"></i> <span id="syncLabel">INDEX</span></div>
        <div class="avatar" id="avatar" aria-label="Profile">OP</div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="section-eyebrow">Private workspace</div>
      <div class="sidebar-title-row">
        <h1 id="sidebarTitle">Ask</h1>
        <button class="new-chat" id="newChat" type="button" aria-label="New conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <label class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="threadSearch" type="search" placeholder="Search conversations" aria-label="Search conversations" />
        <kbd>Ctrl K</kbd>
      </label>
      <div class="thread-label"><span class="section-eyebrow">Conversations</span><span id="threadCount">0</span></div>
      <div class="thread-list" id="threadList"></div>
      <section class="corpus-card" aria-labelledby="corpus-title">
        <div class="corpus-head"><strong id="corpus-title">Knowledge base</strong><button type="button" id="openKnowledge" aria-label="Open knowledge base">↗</button></div>
        <div id="corpusList"></div>
      </section>
    </aside>

    <section class="workspace-page" id="page-knowledge" data-view="knowledge"></section>
    <section class="workspace-page" id="page-document" data-view="document"></section>
    <section class="workspace-page" id="page-pipeline" data-view="pipeline"></section>
    <section class="workspace-page" id="page-analytics" data-view="analytics"></section>
    <section class="workspace-page" id="page-settings" data-view="settings"></section>

    <main class="main">
      <div class="conversation" id="conversation">
        <div class="conversation-inner" id="conversationInner"></div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="askForm">
          <textarea id="askInput" rows="1" placeholder="Ask across your knowledge base…" aria-label="Ask a question"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" class="tool-button" id="addContext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg><span id="contextLabel">Add context</span></button>
              <button type="button" class="tool-button" id="voiceButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20v2M8 22h8"/><rect x="8" y="2" width="8" height="14" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/></svg><span>Voice</span></button>
            </div>
            <button class="send" type="submit" aria-label="Send question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 14-8-5 16-3-6-6-2zM11 14l3-3"/></svg></button>
          </div>
        </form>
        <div class="context-menu" id="contextMenu" hidden></div>
        <div class="legal">Answers are generated from your indexed sources. Verify high-impact decisions.</div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Sources and retrieval trace">
      <div class="inspector-head">
        <div><div class="section-eyebrow">Evidence</div><h2>Why this answer</h2></div>
        <button class="close-inspector" id="closeInspector" type="button" aria-label="Close sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      </div>
      <div id="inspectorBody"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-root" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
    <input id="fileInput" type="file" hidden accept=".pdf,.txt,.md,.text,.docx,.pptx,.xlsx,.csv" />
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
