name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    # Pure logic, schema, and metric tests plus a dataset lint. No dependencies beyond the stdlib.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python backend/test_pipeline_units.py
      - name: Golden datasets
        working-directory: backend
        run: python -m eval validate

  eval-offline:
    # The hermetic suite through the real ingestion and retrieval code: free, deterministic,
    # and gated against backend/eval/baselines/hermetic-offline.json.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Cache the MiniLM ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-minilm-v1
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Offline eval (retrieval gate)
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ""
        run: python -m eval run --suite hermetic --tier offline --out-dir "$RUNNER_TEMP/eval"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-report
          path: ${{ runner.temp }}/eval
